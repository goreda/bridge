# Keep direct mpv-window arrows aligned with Swift's overlay input monitor.
LEFT add volume -5
RIGHT add volume 5
UP seek 60
DOWN seek -60

x script-message-to photon_sharp photon-sharp-toggle

b script-message-to photon photon-bright-toggle
g script-message-to photon_grain photon-grain-toggle

c script-message-to photon_chrome photon-chrome-toggle
shift+c script-message-to photon_chrome photon-chrome-filter-toggle

n script-message-to photon_negativ photon-negativ-toggle

# Grain 'strength': same amount-offset step/directions as the former k/l keys.
# k and l are intentionally unbound, not reassigned.
shift+g script-message-to photon_grain photon-grain-set-amount 1.5
Meta+g script-message-to photon_grain photon-grain-set-amount 0.5

# Sharp factor step 0.10 is about 4.88% of default 2.05; at floor 0.05,
# one up-step reaches 0.15 (3x). Existing step/clamp are unchanged.
# Grain SIZE trim: Cmd+B smaller; Shift+B larger is the reviewed pairing.
Meta+b script-message-to photon_grain photon-grain-size-trim-down
shift+b script-message-to photon_grain photon-grain-size-trim-up
shift+Meta+b script-message-to photon_grain photon-grain-size-trim-reset
shift+x script-message-to photon_sharp photon-sharp-up
Meta+x script-message-to photon_sharp photon-sharp-down

ü add sub-scale -0.05; show-text 'sub scale: ${sub-scale}'
, add sub-scale 0.05; show-text 'sub scale: ${sub-scale}'

1 script-message-to photon_grain photon-grain-set-stock 0
2 script-message-to photon_grain photon-grain-set-stock 1
3 script-message-to photon_grain photon-grain-set-stock 2
4 script-message-to photon_grain photon-grain-set-stock 3
5 script-message-to photon_grain photon-grain-set-stock 4
6 script-message-to photon_grain photon-grain-set-stock 5

Ctrl+F1  script-message-to photon_sharp photon-sharp-fine-coarse 0.0
Ctrl+F2  script-message-to photon_sharp photon-sharp-fine-coarse 0.5

i script-binding gor_stats/display-stats-toggle
