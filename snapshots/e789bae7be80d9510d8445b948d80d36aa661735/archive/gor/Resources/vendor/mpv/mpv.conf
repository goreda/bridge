# VIDEO: REFERENCE QUALITY (PURIST MODE)

# Output engine
vo=gpu-next                  # most accurate color rendering
hwdec=auto-safe              # hardware accel, battery-friendly

# Color management (accuracy-focused)

# Flash fix, final: icc-profile-auto is OFF globally and lives ONLY in
# [hdr-fix] below. HDR tone-mapping genuinely needs live ICC to look
# correct; SDR never reads ICC/color-management data at all (confirmed
# directly in photon.lua), so global auto-querying was paying the ICC
# re-query + LUT-rebuild cost (the flash) on every SDR gamma tick for
# zero benefit. Scoping it to [hdr-fix] keeps HDR color correct while
# removing that cost everywhere else.
target-colorspace-hint=no
icc-profile-auto=no

# Dither: prevents banding in gradients (skies etc).
# Needed for 10-bit video on 8-bit panels.
dither-depth=auto

# WINDOW SETTINGS
autofit-larger=100%x100%
# Owned by launch args in AppDelegate.launchMPV (the command line wins
# over this file, so editing them here did nothing): geometry,
# force-window, cursor-autohide, save-position-on-quit, prefetch-playlist.

# SDR / HDR handling note
# Global manual target overrides removed. The HDR/DV profiles below still
# apply deliberate tone mapping and target transfer curves.

# AUDIO FILE WINDOW FIX

audio-display=embedded-first # show cover art if present, fallback otherwise
background=color
background-color=0/0/0   # black screen for coverless audio

# IMAGE FILE WINDOW FIX

image-display-duration=2
keep-open=yes

# UI & BEHAVIOR
write-filename-in-watch-later-config=yes
watch-later-options-remove=volume,mute,sid,aid,sub-delay,speed,contrast,brightness,gamma,saturation,sub-scale,sub-pos,audio-delay
ontop=yes

# Disable native macOS window controls
no-border

# The custom overlay owns the controls.
osc=no
no-osd-bar

# SUBTITLES
subs-with-matching-audio=yes
blend-subtitles=yes
sub-fix-timing=yes
sub-auto=all
sub-gauss=0
sub-gray=yes
sub-font="Ackerhof-Book"
sub-fonts-dir=~~/fonts
sub-font-size=30
sub-spacing=-0.25
sub-line-spacing=-15
sub-color=0.85/0.8/0.75/0.95
sub-border-color=0.25/0.2/0.15/0.9
sub-border-size=0.5
sub-margin-x=100
sub-margin-y=5
sub-shadow-color=0.0/0.0/0.0/0.20
sub-shadow-offset=0.3
sub-blur=0.2
sub-file-paths=sub;Sub;subs;Subs;subtitles;Subtitles;srt;Srt;SRT;ass;Ass;ASS;
sub-ass-override=force
embeddedfonts=no

osd-font='Ackerhof-Book'
osd-font-size=16
osd-border-size=0.25
osd-shadow-color=0.0/0.0/0.0/0.0
# (duplicate osd-duration removed; the 2000 below is the effective one)
osd-blur=1
osd-playing-msg=''
osd-playing-msg-duration=2222
osd-bar=no
osd-level=0
video-osd=no
osd-duration=2000

# SCREENSHOTS & LANG
screenshot-format=png
screenshot-png-compression=2
screenshot-template='~/Desktop/%F (%P) %n'
screenshot-high-bit-depth=yes

# LANGUAGE (full original)
slang=English,english,en,eng,enm,ar,ara
alang=Japanese,ja,jp,jpn,en,eng,english,English

[sdr-fix]
profile-cond=p["video-params/gamma"] == "bt.1886" or p["video-params/gamma"] == "gamma2.2"
profile-restore=copy
hdr-compute-peak=no


[hdr-fix]
profile-cond=p["video-params/primaries"] == "bt.2020" or p["video-params/gamma"] == "pq"
profile-restore=copy

# ICC lives ONLY here: HDR needs live, accurate ICC to tone-map to this
# specific display correctly. Confirmed SDR has zero ICC dependency, so
# it's deliberately left off everywhere else (see global icc-profile-auto
# above).
icc-profile-auto=yes

# target-colorspace-hint intentionally not set here -- global =no covers it; re-enabling per-profile brings the flash back on every clip transition.

# hdr-compute-peak=no (below, under section 4): this was the CONFIRMED
# cause of the HDR-path flash. It enables libplacebo's continuous dynamic
# peak/contrast re-derivation as HDR content plays, which forces repeated
# color-pipeline rebuilds -- ICC re-query included -- as a side effect.
# This is a real quality-vs-stability tradeoff, not a free fix: HDR
# tone-mapping will no longer adapt live to each scene's actual peak
# brightness, only to the file's static metadata. Watch a real HDR title
# with mixed dark/bright scenes after this change and confirm it still
# looks acceptable -- if it looks flat, the next step is checking whether
# libplacebo exposes a slower dynamic-peak update rate instead of a hard
# on/off, not reverting this to =yes.

# 1. TONE MAPPING: mobius over bt.2390 -- lifts shadows more
# aggressively than bt.2446a while keeping saturation intact.
tone-mapping=mobius

# 2. BRIGHTNESS LIE: pretend target-peak is 150 nits so mpv
# opens up dark scenes more, assuming a dim display.
# target-peak=222

# 3. GAMMA: force HDR's dark tonal curve onto SDR-standard BT.1886
# so shadow detail stays visible.
target-trc=bt.1886

# 4. DYNAMIC PEAK (off): confirmed cause of the HDR flash (continuous
# libplacebo re-derivation forcing repeated pipeline rebuilds). Also
# happens to mean static high brightness is more consistent, per the
# original reasoning here.
hdr-compute-peak=no

# 5. SATURATION: keep colors from washing out as brightness goes up.
gamut-mapping-mode=perceptual

saturation=-10

hwdec=videotoolbox

# [music]
# profile-cond=music or (not p["vid"] and (p["aid"] or p["sid"]))
# profile-restore=copy

# 1. WINDOW & ASPECT
# autofit-larger=100%x100%
# geometry=1280x1280
# autofit=1280x1280
# video-aspect-override=1:1
# audio-display=embedded-first

# osd-level=0
# osd-playing-msg='${metadata/title}\n${metadata/artist}'

[protocol.https]
# cap internet video at 1080p (easier on M1 Air)
ytdl-format="bestvideo[height<=?1080]+bestaudio/best"
# raise buffer to avoid stutter
# cache=yes
# demuxer-max-bytes=500MiB
# demuxer-max-back-bytes=100MiB

# DOLBY VISION CRASH FIX
[dolby-vision]
profile-cond=properties['dovy'] ~= nil
profile-restore=copy
# target-colorspace-hint intentionally not set here -- global =no covers it.
# icc-profile-auto=yes added here, NOT inherited from global anymore:
# global icc-profile-auto is now =no (see top of file), so without this
# line DV content would silently get NO live ICC at all -- that's an
# accidental side effect of the global change, not a tested choice. DV
# is HDR and needs correct color the same as [hdr-fix] content, so the
# same reasoning applies: keep ICC live here specifically. This wasn't
# separately tested against a real DV file the way [sdr-fix]/[hdr-fix]
# were -- confirm no flash and correct color on an actual Dolby Vision
# title before treating this block as settled.
icc-profile-auto=yes
hdr-compute-peak=no
target-trc=pq
tone-mapping=auto

# BLUETOOTH STABILITY TWEAKS
# ao=coreaudio                 # bypass intermediate layers, use native api
# audio-buffer=0.7             # increase buffer to absorb decode spikes (crucial for bluetooth)
# audio-stream-silence=yes     # keep a2dp link alive during silent periods
